      <h1 class="jumbotron-heading" style="font-size:35px;color:#800000">WELCOME TO PCa APP</h1>
      <p class="lead text-muted">Prostate cancer (PCa) is one of the major causes of cancer death for men. Multi-parametric MRI (mpMRl) Is increasingly being used for PCa diagnosis. While mpMRl is very good at detecting prostate cancers, still 15-30% of clinically significant cancers can be missed even by expert radiologists. The current state of prostate mpMRl is based on the subjective assessment by radiologists that need extensive training. Artificial intelligence and computer aided diagnosis tools have been investigated for PCa diagnosis using mpMRl data to mitigate the problems with variability in PCa diagnosis among radiologists. Numerous studies have shown promising results, however low specificity and high false positive rates remain to be a major concern limiting wide spread use of mpMRl for screening and diagnosis of PCa.</p>

    </div>
