<template name="entrySignIn">
    {{#header headerClasses='navbar-fixed-top'}}
    {{#section 'brand'}}
    <img src={{absoluteUrl "/packages/ohif_viewerbase/assets/logo.png"}} alt="PCa Finder: Prostate Cancer Finder"
        class="img-responsive">

    <!-- <svg class="logo-image">
            <use xlink:href={{absoluteUrl "/packages/ohif_viewerbase/assets/shield.svg#icon-ohif-logo"}}></use>
        </svg> -->
    {{/section}}
    <!--{{#section 'headerAfterBrand'}}
            {{#if studyListToggleText}}
                <a href="#" class="btn studyListLinkSection pull-left js-toggle-studyList">
                    {{studyListToggleText}}
                </a>
            {{/if}}
        {{/section}}
    {{#section 'headerMenu'}}
            <span class="user-name pull-left m-r-1">{{userName}}</span>
            <span class="header-options pull-left m-r-1"> | </span>
            <span class="header-options pull-left m-r-1">Options</span>
            <div class="menu-toggle pull-right">
                <span class="caret-down"></span>
            </div>
        {{/section}} -->
    {{/header}}


    <div class="intro bg-primary position-relative">
        <div class="bg-overlay-primary">
            <img src={{absoluteUrl "/packages/ohif_viewerbase/assets/bg_video.jpg"}} class="img-fluid img-cover"
                alt="Pca Finder: Prostate Cancer Finder">
        </div>
        <div class="intro-content">
            <div class="container">
                <div class="row">
                    <div class="col-md-6 p-b-3 align-self-center">
                        <h1 class="display-4 m-b-1">AI-based Prediction<br> and Segmentation</h1>
                        <p class="lead m-b-2">A web application for the identification of clinically significant
                            prostate
                            cancer in MRI.</p>
                        <button id="btnExploreMore" type="button" class="btn btn-warning btn-block btn-lg mb-2">Explore
                            Now</button>
                    </div><!-- /.col-md-6 -->
                    <div class="col-md-6 ml-auto">
                        <div class="card">
                            <div class="card-body text-dark">
                                <div class="video-responsive">
                                    <video id="bgvid" autoplay loop muted playsinline preload=metadata>
                                        <!-- poster={{absoluteUrl "/images/bg_video.jpg"}} -->
                                        <!-- <source src='media/samplevideo.mp4' type='video/mp4'> -->
                                        <source
                                            src={{absoluteUrl "/packages/ohif_viewerbase/assets/prostrate_intro.webm"}}
                                            type='video/webm'>
                                        <!-- <source src='media/samplevideo.ogg' type='video/ogg'> -->
                                        <p>Please use a modern browser to view this video.</p>
                                    </video>
                                </div>
                            </div>
                        </div>
                    </div><!-- /.col-md-6 -->
                </div>
            </div>
        </div>
    </div>

    <!-- Fix it -->
    <div id="entrySignIn" class="page" style="{{getOpacityWithCorner}}">
        <div class="content-scrollable">

            <div class="container">

                <!-- Main component for a primary marketing message or call to action -->
                <div class="jumbotron m-b-0">
                    <!-- <h1 class="text-center">About us</h1>
                    <div class="sec-line" style="visibility: visible;"></div> -->
                    <p>
                        Prostate Cancer (PCa) is the most common non-cutaneous malignancy
                        and one of the most common causes of cancer-related deaths among men.
                        Although multi-parametric MRI (mpMRI) is good at detecting prostate
                        cancers and has been increasingly used for PCa diagnosis, the likelihood
                        of clinical misdiagnosis of significant PCa even by expert radiologists is still
                        15-30%.
                    </p>
                    <hr class="featurette-divider">
                    <p>The Research Computing Center (RCC) at the University of Chicago is working on
                        the automatic classification of clinically significant PCa
                        findings by integrating mpMRI images with artificial intelligence.
                        The 3D Convolutional neuronal network (CNN3D) model was trained using multiple MRI acquisition
                        modalities (e.g. T2w,
                        ADC, and diffusion weighted imagings) to estimate the PCa significance.</p>

                </div>

            </div>
        </div>
    </div>

    <!-- FOOTER BEGINS -->
    {{#footer}}
    {{/footer}}
    <!-- FOOTER ENDS -->

</template>
